<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b221e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>神月京都物语 · 🎴 学习收藏</title><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../images/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="collection">
<div class="app-shell">
  <aside id="sidebar"></aside>
  <main class="main-stage">
    <header class="topbar">
      <div class="player-info">
        <div class="player-name">🎴 学习收藏</div>
        <div class="player-level">YOUR LEARNING LIBRARY</div>
      </div>
      <div class="header-progress">
        <div class="header-progress-line"><span data-header-daily>今日 0 / 12</span><span data-header-exp>总经验 0 EXP</span></div>
        <div class="exp-bar"><div class="exp-value" data-header-bar></div></div>
      </div>
    </header>
    
<section class="page-hero study-hero">
  <div><span class="section-kicker">COLLECTION</span><h1>学习收藏</h1><p>这里不是“收集游戏”，而是把已经解锁、已经掌握的内容集中起来复习。</p></div>
  <div class="hero-chip"><b id="collection-total">0</b><span>项已有学习记录</span></div>
</section>

<section class="collection-tabs" id="collection-tabs">
  <button class="culture-tab active" data-tab="kana">あ 五十音</button>
  <button class="culture-tab" data-tab="vocab">単 单词</button>
  <button class="culture-tab" data-tab="grammar">文 语法</button>
  <button class="culture-tab" data-tab="patterns">句 句型</button>
  <button class="culture-tab" data-tab="reading">読 阅读</button>
</section>

<section class="collection-page">
  <div id="collection-content"></div>
</section>

  </main>
</div>
<script src="../js/shared.js"></script>
<script src="../js/collection.js"></script>
</body>
</html>
